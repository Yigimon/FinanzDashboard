<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1118">
<title>mindcrafted.me</title>
<style>
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0e1118; --surface:#1a1e28; --border:#2b3140; --text:#eef0ec; --text2:#a9afc0; }
  }
  :root{ --bg:#eef0ec; --surface:#ffffff; --border:#dcdfd3; --text:#1b2130; --text2:#565f6e; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  main{max-width:420px;width:100%;padding:32px;}
  h1{font-size:22px;margin:0 0 8px;}
  p{color:var(--text2);margin:0 0 28px;font-size:14.5px;}
  .links{display:flex;flex-direction:column;gap:12px;}
  a{display:block;padding:16px 18px;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;color:var(--text);text-decoration:none;font-size:15px;font-weight:600;
    transition:transform .15s, border-color .15s;}
  a:hover{transform:translateY(-1px);border-color:var(--text2);}
  a span{display:block;font-weight:400;font-size:12.5px;color:var(--text2);margin-top:3px;}
</style>
</head>
<body>
<main>
  <h1>mindcrafted.me</h1>
  <p>Projekte im Überblick</p>
  <div class="links">
    <a href="/finanz">Finanz-Cockpit<span>Vermögens-Dashboard</span></a>
    <a href="/fitness">Fitness-Tracker<span>Gewicht &amp; Körperwerte</span></a>
  </div>
</main>
</body>
</html>
