<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Finanz-Cockpit</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="apphead">
<span class="applogo"><i class="ti ti-chart-donut-4" aria-hidden="true"></i></span>
<span style="flex:1;">
<span class="apptitle">Finanz-Cockpit</span>
<span class="appsub">Dein persönliches Finanz- und Vermögens-Dashboard</span>
</span>
<button id="theme-toggle" class="iconbtn" aria-label="Hell/Dunkel umschalten" title="Hell/Dunkel umschalten" style="font-size:20px;padding:8px;"><i class="ti ti-moon" aria-hidden="true"></i></button>
</header>
<nav id="tabs" aria-label="Bereiche">
<button class="tabbtn on" data-tab="dash"><i class="ti ti-layout-dashboard" aria-hidden="true"></i> Übersicht</button>
<button class="tabbtn" data-tab="posten"><i class="ti ti-list-details" aria-hidden="true"></i> Posten</button>
<button class="tabbtn" data-tab="monate"><i class="ti ti-calendar-month" aria-hidden="true"></i> Monate</button>
<button class="tabbtn" data-tab="analyse"><i class="ti ti-chart-pie" aria-hidden="true"></i> Analyse</button>
<button class="tabbtn" data-tab="verlauf"><i class="ti ti-timeline" aria-hidden="true"></i> Verlauf</button>
<button class="tabbtn" data-tab="tipps"><i class="ti ti-bulb" aria-hidden="true"></i> Tipps</button>
<button class="tabbtn" data-tab="ziele"><i class="ti ti-target-arrow" aria-hidden="true"></i> Ziele</button>
<button class="tabbtn" data-tab="erfolge"><i class="ti ti-trophy" aria-hidden="true"></i> Erfolge</button>
<button class="tabbtn" data-tab="kalender"><i class="ti ti-calendar-event" aria-hidden="true"></i> Kalender</button>
<button class="tabbtn" data-tab="depot"><i class="ti ti-trending-up" aria-hidden="true"></i> Depot</button>
<button class="tabbtn" data-tab="ki"><i class="ti ti-sparkles" aria-hidden="true"></i> KI</button>
<button class="tabbtn" data-tab="daten"><i class="ti ti-database" aria-hidden="true"></i> Daten</button>
</nav>
<main>
<section id="tab-dash"></section>
<section id="tab-posten" hidden></section>
<section id="tab-monate" hidden></section>
<section id="tab-analyse" hidden></section>
<section id="tab-verlauf" hidden></section>
<section id="tab-tipps" hidden></section>
<section id="tab-ziele" hidden></section>
<section id="tab-erfolge" hidden></section>
<section id="tab-kalender" hidden></section>
<section id="tab-depot" hidden></section>
<section id="tab-ki" hidden></section>
<section id="tab-daten" hidden></section>
</main>
<footer class="appfoot">Daten werden lokal in diesem Browser gespeichert (localStorage). Kein Server, keine Cloud.</footer>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="js/store.js"></script>
<script src="js/calc.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/posten.js"></script>
<script src="js/views/monate.js"></script>
<script src="js/views/analyse.js"></script>
<script src="js/views/verlauf.js"></script>
<script src="js/views/tipps.js"></script>
<script src="js/views/ziele.js"></script>
<script src="js/views/erfolge.js"></script>
<script src="js/views/kalender.js"></script>
<script src="js/views/depot.js"></script>
<script src="js/views/ki.js"></script>
<script src="js/views/daten.js"></script>
<script src="js/app.js"></script>
</body>
</html>
