<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script>document.write('<base href="' + (location.pathname.indexOf('/fitness') === 0 ? '/fitness/' : '/') + '">');</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151d">
<title>Fitness-Tracker</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a href="#main" class="skip">Zum Inhalt springen</a>
<div class="shell">

  <!-- ============ Seitenleiste ============ -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-logo"><img src="favicon.svg" alt="" class="brand-logo-img"></span>
      <span class="brand-text">
        <span class="brand-title">Fitness-Tracker</span>
        <span class="brand-sub">Gewicht &amp; Körperwerte</span>
      </span>
    </div>

    <nav id="tabs" aria-label="Bereiche">
      <p class="navgroup">Überblick</p>
      <button class="tabbtn on" data-tab="uebersicht"><i class="ti ti-layout-dashboard" aria-hidden="true"></i><span>Übersicht</span></button>

      <p class="navgroup">Personen</p>
      <button class="tabbtn" data-tab="profile"><i class="ti ti-users" aria-hidden="true"></i><span>Profile</span></button>
      <button class="tabbtn" data-tab="gewicht"><i class="ti ti-scale" aria-hidden="true"></i><span>Gewicht</span></button>
      <button class="tabbtn" data-tab="auswertung"><i class="ti ti-chart-line" aria-hidden="true"></i><span>Auswertung</span></button>

      <p class="navgroup">Daten</p>
      <button class="tabbtn" data-tab="daten"><i class="ti ti-database" aria-hidden="true"></i><span>Sichern &amp; Reset</span></button>
    </nav>

    <div class="sidefoot">
      <button id="theme-toggle" class="themetoggle" aria-label="Hell/Dunkel umschalten" title="Hell/Dunkel umschalten">
        <i class="ti ti-moon" aria-hidden="true"></i><span>Design</span>
      </button>
    </div>
  </aside>

  <!-- ============ Inhaltsbereich ============ -->
  <div class="content">
    <header class="topbar">
      <button id="nav-toggle" class="navtoggle" aria-label="Menü" title="Menü"><i class="ti ti-menu-2" aria-hidden="true"></i></button>
      <div class="topbar-head">
        <h1 id="page-title">Übersicht</h1>
        <p id="page-sub" class="topbar-sub"></p>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <section id="tab-uebersicht"></section>
      <section id="tab-profile" hidden></section>
      <section id="tab-gewicht" hidden></section>
      <section id="tab-auswertung" hidden></section>
      <section id="tab-daten" hidden></section>
      <footer class="appfoot">Daten werden lokal in diesem Browser gespeichert (localStorage). Kein Server, keine Cloud.</footer>
    </main>
  </div>
</div>

<div id="nav-scrim" class="nav-scrim" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
<script src="js/store.js"></script>
<script src="js/calc.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/uebersicht.js"></script>
<script src="js/views/profile.js"></script>
<script src="js/views/gewicht.js"></script>
<script src="js/views/auswertung.js"></script>
<script src="js/views/daten.js"></script>
<script src="js/app.js"></script>
<script src="js/sync.js"></script>
</body>
</html>
